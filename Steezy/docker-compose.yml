# Local Postgres for development: `npm run db:up`, then `npm run db:migrate`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: steezy
      POSTGRES_PASSWORD: steezy
      POSTGRES_DB: steezy
    ports:
      - '5432:5432'
    volumes:
      - steezy-pg:/var/lib/postgresql/data

volumes:
  steezy-pg:
